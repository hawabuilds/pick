allowBuilds:
  unrs-resolver: true
  sharp: true
  esbuild: true
  # Pulled in transitively by the WalletConnect connector, which uses AppKit for
  # its QR modal. Not a direct dependency: the wagmi adapter was dropped because
  # it pins wagmi 2 while the app runs wagmi 3.
  "@reown/appkit": true
  # Optional native accelerators with pure-JS fallbacks. Left unbuilt so the
  # install does not depend on a local C++ toolchain.
  bufferutil: false
  utf-8-validate: false
  keccak: false
